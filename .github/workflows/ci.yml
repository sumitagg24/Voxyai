name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed credentials
        run: |
          set -euo pipefail
          # Fail on private keys, common API key shapes and committed .env files.
          patterns='BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          if git grep -nEI "$patterns" -- . ':!*.md' ':!*.example' ':!tests/*'; then
            echo "::error::Possible credential committed. Remove it and rotate the key."
            exit 1
          fi
          echo "No credential patterns found."
      - name: Reject committed user data / build output
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(data/.*\.(db|sqlite3)|.*\.vault)$|^config/(users|sessions)\.json$|^dist/|^build/|\.zip$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked files that must not be committed:"
            echo "$bad"
            exit 1
          fi
          echo "Working tree contains no user data or build output."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "black==24.4.2" "flake8>=7.0.0"
      - name: black
        run: black --check --diff .
      - name: flake8
        # E501 (line too long) is noisy for user-facing strings that are 120+ chars;
        # black already enforces 120, and the remaining 20-odd E501s are intentional
        # copy that would be worse split. Keep the other checks strict.
        run: flake8 . --max-line-length 120 --extend-ignore E203,W503,E501

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps for audio tests
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev
      - name: Install backend + test dependencies
        # Deliberately not the full requirements.txt: desktop audio/GUI wheels
        # need system libraries that are irrelevant to these tests, but the
        # observability and transcriber tests do need numpy and sentry-sdk.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "flask>=3.0.0" "flask-cors>=4.0.0" "flask-caching>=2.1.0" \
            "flask-limiter>=3.5.0" "werkzeug>=3.0.0" "requests>=2.31.0" \
            "python-dotenv>=1.0.0" "pytest>=7.4.3" "pytest-cov>=4.1.0" \
            "numpy>=1.24.3" "sentry-sdk>=2.0.0" "sounddevice>=0.5.0" "scipy>=1.11.4"
      - name: Run test suite
        run: pytest tests -v --cov=web --cov=core --cov=utils --cov-report=xml
      - name: Flask app imports
        run: python -c "from web.app import app; print('Flask app loads OK')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit pinned dependencies
        # Blocking on purpose: a known-vulnerable dependency must be triaged
        # (upgrade, or add a justified --ignore-vuln with a tracked issue).
        # black 24.4.2 is pinned for deterministic formatting (see pyproject.toml
        # line-length 120); pip-audit reports PYSEC-2026-2120/2121 fixed in
        # 26.3.0/26.3.1, but the formatter is dev-only and never shipped.
        run: pip-audit -r requirements.txt --strict --ignore-vuln PYSEC-2026-2120 --ignore-vuln PYSEC-2026-2121

  build-desktop:
    name: Build Windows EXE + installer
    runs-on: windows-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read canonical version
        id: version
        shell: pwsh
        run: |
          $v = python -c "from config.version import __version__; print(__version__)"
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - run: pip install -r requirements.txt
      - run: python -m config.version --sync
      - run: pyinstaller voxylis.spec --clean --noconfirm
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.value }} installer\voxylis.iss
      - name: Verify no credentials in the build
        shell: pwsh
        run: |
          $hits = Select-String -Path "dist\Voxylis\*","dist\Voxylis\_internal\*" -Pattern "gsk_[A-Za-z0-9]{20,}","sk-[A-Za-z0-9]{20,}" -List -ErrorAction SilentlyContinue
          if ($hits) { Write-Error "Credential pattern found in build output"; exit 1 }
      - name: Inspect EXE version metadata
        shell: pwsh
        run: |
          $info = (Get-Item "dist\Voxylis\Voxylis.exe").VersionInfo
          Write-Host "ProductVersion: $($info.ProductVersion)"
          if ($info.ProductVersion -ne "${{ steps.version.outputs.value }}") {
            Write-Error "EXE metadata ($($info.ProductVersion)) does not match the canonical version"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Voxylis-Windows-${{ steps.version.outputs.value }}
          path: |
            dist/Voxylis/**
            installer/output/*.exe

  deploy-web:
    name: Deploy website
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
