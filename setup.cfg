[flake8]
max-line-length = 120
# E501 is not enforced: black owns line wrapping for code, and the remaining
# long lines are prose, embedded HTML/JS and long literal strings, where
# reflowing hurts readability more than a long line does.
extend-ignore = E203, W503, E501
per-file-ignores =
    core/app_orchestrator.py: E402
    web/app.py: E402
exclude =
    venv,
    .venv,
    env,
    .git,
    __pycache__,
    build,
    dist
