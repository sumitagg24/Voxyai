# Voxylis tooling configuration.
# Only formatter settings live here: this repository is a plain application
# tree (no packaged distribution), so there is no [project] table.

[tool.black]
# flake8 runs with max-line-length = 120 (see setup.cfg). Without this line
# black defaults to 88, so `black --check .` fails on nearly every file and the
# CI lint job can never pass. Keep the two aligned.
line-length = 120
target-version = ["py310"]

[tool.vercel]
entrypoint = "web.app:app"

[project]
# Vercel's uv builder REQUIRES this table. Server-only deps mirrored from
# requirements-server.txt (Flask never imports the desktop stack).
# version MUST equal config/version.py — bump together on release (R3!).
name = "voxylis"
version = "3.0.0"
requires-python = "==3.12.*"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-caching>=2.1.0",
    "flask-limiter>=3.5.0",
    "werkzeug>=3.0.0",
    "groq>=0.4.2",
    "openai>=1.3.9",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "sentry-sdk>=2.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]
