<style>
:root{

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--host);min-height:100vh;display:flex;flex-direction:column}

.nav .logo .mark{width:28px;height:28px;background:var(--ink);color:#fff;display:grid;place-items:center;border-radius:8px;font-size:15px}
.nav .actions{display:flex;gap:12px;align-items:center}
.nav .actions a{font-size:14px;text-decoration:none;color:var(--ink2)}
.nav .actions a.cta{border:1.5px solid var(--line);padding:8px 16px;border-radius:999px;font-weight:600;color:var(--ink)}
.nav .actions a.cta:hover{background:var(--ink);color:#fff}
main.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px}
.code{font-family:var(--mono);font-size:96px;font-weight:700;letter-spacing:-4px;line-height:1}
.code span{color:var(--pink-d)}
h1{font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-top:18px}
p.sub{color:var(--ink2);font-size:16px;margin-top:10px;max-width:460px;line-height:1.6}
.actions-row{margin-top:32px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;font-family:var(--host);font-size:15px;font-weight:600;text-decoration:none;padding:13px 26px;border-radius:999px;background:var(--ink);color:#fff}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg2)}
.hint{margin-top:36px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.hint a{color:var(--muted)}
footer{border-top:1px solid var(--line2);padding:20px 40px;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--ink)}
@media(max-width:640px){.nav{padding:16px 20px}.code{font-size:64px;letter-spacing:-2px}h1{font-size:22px}footer{padding:16px 20px}}
